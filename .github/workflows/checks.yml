name: Checks

# tests/run.sh on every push: build, data, photos, fonts, scripts, private data, and the screen
# in a real browser. The Android apps are compiled by android.yml.
on:
  push:
    branches: [master, next, content]
  pull_request:
  workflow_dispatch:
  workflow_call:   # android.yml runs it before publishing to apk-latest

jobs:
  checks:
    # ubuntu-latest is 26.04 now, where Playwright 1.56 has no Chromium build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Thmanyah's licence allows its files only inside a built product, never hosted: this repository keeps them
      # encrypted (.github/signing/fonts.tar.enc, the same password as the signing key) and they are opened only here
      - name: Private fonts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p .fonts-private android/launcher/src/main/assets/fonts
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in .github/signing/fonts.tar.enc -pass env:KEYSTORE_PASSWORD | tar x -C .fonts-private
          cp .fonts-private/web/*.woff2 assets/fonts/
          cp .fonts-private/android/*.otf android/launcher/src/main/assets/fonts/
          rm -rf .fonts-private
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # a Python of its own: pip then installs into its site-packages, which python -I still sees (optimize/ runs its
      # scripts with -I, like the venv does on people's computers); the runner's system pip went to the user's folder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli pillow -r .github/tools/cities-world/requirements.txt
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: tests/run.sh
