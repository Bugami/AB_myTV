<!doctype html>
<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الواجهة الرئيسية</title>
<!--
  The home screen's clock and cards, drawn over the launcher's photos and behind the launcher's own buttons (top left) and favourites (bottom).
  sa.urtv.home loads it full screen in a WebView that never takes focus; everything here is look, nothing is
  pressed. Built by src/build.py into dist/home.html; the launcher fetches that file from the repo every 6 hours.
  Settings come in the fragment like the screensaver's: #city=..&lat=..&lon=..&tz=..  (and &now=ISO for previews)
  The page itself is transparent. Leaves free: the top-left corner (the buttons) and the bottom 30% (the favourites).
-->

  @font-face{font-family:'Thmanyah';font-weight:300;font-display:block;src:url("https://raw.githubusercontent.com/Bugami/AB_myTV/master/assets/fonts/Thmanyah-Light.woff2") format("woff2")}

  /* layout: a 16:9 stage in vw/vh over the launcher's own photos (the screensaver's Saudi landscapes, a new one
     every 10 minutes): clock and dates top right, weather and prayer cards top left under the launcher's buttons,
     a verse and a hadith side by side in the middle, the bottom 30% left to the launcher's favourites. */
  :root{
    --glass:rgba(8,12,22,.46); --edge:rgba(255,255,255,.26); --ink:#ffffff; --ink2:rgba(255,255,255,.80);
    --accent:#ffd98a; --hl:rgba(255,255,255,.18);
    --sans:'Thmanyah','Marks','Noto Naskh Arabic',sans-serif;
    --display:'ThmanyahDisplay','Thmanyah','Marks',serif;
    --shadow:0 .1vw .6vw rgba(0,0,0,.55);
  }
  html,body{margin:0;height:100%;overflow:hidden;cursor:none;user-select:none;background:transparent}
  body{font-family:var(--sans);color:var(--ink);opacity:0;animation:show .6s .3s forwards}
  @keyframes show{to{opacity:1}}
  .num{font-variant-numeric:tabular-nums}
  /* a soft shade behind the clock and the cards, so white text holds on bright sand or sky */
  #shade{position:absolute;inset:0;background:
    radial-gradient(ellipse 48vw 34vh at 82% 26%,rgba(0,0,0,.34),transparent 70%),
    radial-gradient(ellipse 40vw 34vh at 20% 30%,rgba(0,0,0,.26),transparent 70%),
    radial-gradient(ellipse 46vw 16vh at 50% 58%,rgba(0,0,0,.30),transparent 72%)}

  /* ---------------------------------------------------------------- top right: clock and dates */
  #when{position:absolute;right:5vw;top:13vh;display:flex;align-items:center;gap:2.4vw;text-shadow:var(--shadow)}
  #clock{display:flex;align-items:flex-end;gap:.8vw;direction:ltr}
  #ampm{font-size:2.5vw;font-weight:500;color:var(--ink2);margin-bottom:1.8vw}
  #hm{font-family:var(--display);font-weight:700;font-size:11.5vw;line-height:.95;letter-spacing:0;
      text-shadow:0 .3vw 2.4vw rgba(0,0,0,.45)}
  #hm .d{display:inline-block;margin:0 .05em}
  /* the display face draws its colon as two diamonds: two round dots instead */
  #hm .c{display:inline-flex;flex-direction:column;justify-content:center;gap:.16em;height:.62em;margin:0 .12em;vertical-align:.1em}
  #hm .c i{width:.11em;height:.11em;border-radius:50%;background:currentColor;opacity:.9}
  .vline{width:1px;align-self:stretch;margin:1.2vw 0;background:linear-gradient(transparent,rgba(255,255,255,.6),transparent)}
  #dates{display:flex;flex-direction:column;gap:.6vw;text-align:right}
  #day{font-size:2.9vw;font-weight:500}
  #hijri,#greg{font-size:1.85vw;font-weight:400;color:var(--ink)}
  #greg{color:var(--ink2)}

  /* ---------------------------------------------------------------- top left: weather and prayer cards */
  #cards{position:absolute;left:5vw;top:16vh;display:flex;gap:1.2vw;align-items:flex-start}
  .block .hd{font-size:1.4vw;font-weight:500;margin:0 .3vw .6vw;color:var(--ink);text-shadow:var(--shadow)}
  .card{
    width:18vw;height:30vh;box-sizing:border-box;padding:1.15vw 1.3vw;border-radius:1.1vw;
    background:var(--glass);border:1px solid var(--edge);
    box-shadow:0 1vw 3vw rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.14);
    display:flex;flex-direction:column;
  }
  /* weather */
  #wx-city{display:flex;align-items:center;justify-content:center;gap:.4vw;font-size:1.25vw;color:var(--ink)}
  #wx-city svg{width:1.1vw;height:1.1vw}
  #wx-main{flex:1;display:flex;align-items:center;justify-content:center;gap:1vw;direction:ltr}
  #wx-icon{width:4.8vw;height:4.8vw}
  #wx-temp{font-family:var(--display);font-weight:700;font-size:3.7vw;line-height:1}
  #wx-desc{text-align:center;font-size:1.2vw;color:var(--ink2);margin-top:-.8vh}
  #wx-stats{display:flex;justify-content:space-between;margin-top:1.3vh;padding-top:1vh;border-top:1px solid rgba(255,255,255,.18)}
  .st{display:flex;flex-direction:column;align-items:center;gap:.2vw;font-size:1.12vw}
  .st small{font-size:.85vw;color:var(--ink2)}
  .st svg{width:1vw;height:1vw;opacity:.85}
  #wx-off{flex:1;display:none;align-items:center;justify-content:center;text-align:center;font-size:1.2vw;color:var(--ink2)}
  .wx-none #wx-main,.wx-none #wx-desc,.wx-none #wx-stats{display:none}
  .wx-none #wx-off{display:flex}
  /* prayers */
  #prayers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-around;flex:1}
  #prayers li{display:flex;align-items:center;gap:.7vw;padding:.6vh .7vw;border-radius:.6vw;font-size:1.4vw}
  #prayers li svg{width:1.3vw;height:1.3vw;flex:none;opacity:.9}
  #prayers li .n{flex:1}
  #prayers li .t{direction:rtl}
  #prayers li.next{background:var(--hl);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  #prayers li.next .t,#prayers li.next .n{font-weight:500;color:var(--accent)}
  #prayers li.past{opacity:.6}

  /* ---------------------------------------------------------------- a verse and a hadith, side by side */
  #quotes{position:absolute;left:5vw;right:5vw;top:51.5vh;display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;align-items:stretch}
  .h{
    box-sizing:border-box;padding:1.5vh 2.4vw 1.4vh;border-radius:1.2vw;text-align:center;
    background:var(--glass);border:1px solid var(--edge);box-shadow:0 1vw 3vw rgba(0,0,0,.25);
    display:flex;flex-direction:column;gap:.5vh;min-width:0;
  }
  .h .who{font-size:1.15vw;color:var(--accent);font-weight:500}
  .h .tx{
    font-size:1.75vw;line-height:1.6;font-weight:400;min-width:0;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:.15em;
  }
  .h .src{font-size:1vw;color:var(--ink2)}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the Marks subset */
  .h .orn{font-family:'Marks',serif;color:var(--accent);padding:0 .12em;font-size:1.05em}
  #vrow,#hrow{display:flex;min-width:0}
  #vrow .h,#hrow .h{flex:1}
  #hrow .h.in{animation-delay:.12s}
  .h.in{animation:rise .8s both}
  @keyframes rise{from{opacity:0;transform:translateY(1vh)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){.h.in{animation:none}}
</style>
</head>
<body>

<div id="shade"></div>

<section id="when">
  <div id="clock"><span id="ampm"></span><span id="hm" class="num"></span></div>
  <div class="vline"></div>
  <div id="dates"><div id="day"></div><div id="hijri"></div><div id="greg"></div></div>
</section>

<section id="cards">
  <div class="block">
    <div class="hd">أوقات الصلاة</div>
    <div class="card"><ul id="prayers"></ul></div>
  </div>
  <div class="block">
    <div class="hd">الطقس</div>
    <div class="card" id="wx">
      <div id="wx-city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="wx-name"></span></div>
      <div id="wx-main"><span id="wx-temp" class="num"></span><span id="wx-icon"></span></div>
      <div id="wx-desc"></div>
      <div id="wx-stats">
        <div class="st"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg><span id="wx-feel" class="num"></span><small>المحسوسة</small></div>
        <div class="st"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg><span id="wx-hum" class="num"></span><small>الرطوبة</small></div>
        <div class="st"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg><span id="wx-wind" class="num"></span><small>كم/س</small></div>
      </div>
      <div id="wx-off">الطقس غير متاح الآن</div>
    </div>
  </div>
</section>

<section id="quotes"><div id="vrow"></div><div id="hrow"></div></section>

َمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", "surah": "سورة إبراهيم", "ayah": 40}, {"text": "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", "surah": "سورة إبراهيم", "ayah": 41}, {"text": "نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ", "surah": "سورة الحجر", "ayah": 49}, {"text": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُنْ مِنَ السَّاجِدِينَ", "surah": "سورة الحجر", "ayah": 98}, {"text": "وَإِنْ تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا إِنَّ اللَّهَ لَغَفُورٌ رَحِيمٌ", "surah": "سورة النحل", "ayah": 18}, {"text": "إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ وَيَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَالْبَغْيِ يَعِظُكُمْ لَعَلَّكُمْ تَذَكَّرُونَ", "surah": "سورة النحل", "ayah": 90}, {"text": "مَنْ عَمِلَ صَالِحًا مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 97}, {"text": "وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُلْ رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "surah": "سورة الإسراء", "ayah": 24}, {"text": "وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا", "surah": "سورة الإسراء", "ayah": 82}, {"text": "إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", "surah": "سورة الكهف", "ayah": 10}, {"text": "قَالَ لَا تَخَافَا إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ", "surah": "سورة طه", "ayah": 46}, {"text": "فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِنْ قَبْلِ أَنْ يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُلْ رَبِّ زِدْنِي عِلْمًا", "surah": "سورة طه", "ayah": 114}, {"text": "وَأْمُرْ أَهْلَكَ بِالصَّلَاةِ وَاصْطَبِرْ عَلَيْهَا لَا نَسْأَلُكَ رِزْقًا نَحْنُ نَرْزُقُكَ وَالْعَاقِبَةُ لِلتَّقْوَىٰ", "surah": "سورة طه", "ayah": 132}, {"text": "وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأنبياء", "ayah": 83}, {"text": "وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", "surah": "سورة المؤمنون", "ayah": 118}, {"text": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ وَكَفَىٰ بِهِ بِذُنُوبِ عِبَادِهِ خَبِيرًا", "surah": "سورة الفرقان", "ayah": 58}, {"text": "وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا وَإِذَا خَاطَبَهُمُ الْجَاهِلُونَ قَالُوا سَلَامًا", "surah": "سورة الفرقان", "ayah": 63}, {"text": "وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ", "surah": "سورة الشعراء", "ayah": 80}, {"text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة الشعراء", "ayah": 83}, {"text": "أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الْأَرْضِ أَإِلَٰهٌ مَعَ اللَّهِ قَلِيلًا مَا تَذَكَّرُونَ", "surah": "سورة النمل", "ayah": 62}, {"text": "وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا لِتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَتَفَكَّرُونَ", "surah": "سورة الروم", "ayah": 21}, {"text": "يَا بُنَيَّ أَقِمِ الصَّلَاةَ وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنْكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ إِنَّ ذَٰلِكَ مِنْ عَزْمِ الْأُمُورِ", "surah": "سورة لقمان", "ayah": 17}, {"text": "وَتَوَكَّلْ عَلَى اللَّهِ وَكَفَىٰ بِاللَّهِ وَكِيلًا", "surah": "سورة الأحزاب", "ayah": 3}, {"text": "إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا", "surah": "سورة الأحزاب", "ayah": 56}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلًا سَدِيدًا", "surah": "سورة الأحزاب", "ayah": 70}, {"text": "وَقَالُوا الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنَّا الْحَزَنَ إِنَّ رَبَّنَا لَغَفُورٌ شَكُورٌ", "surah": "سورة فاطر", "ayah": 34}, {"text": "أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ وَيُخَوِّفُونَكَ بِالَّذِينَ مِنْ دُونِهِ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ", "surah": "سورة الزمر", "ayah": 36}, {"text": "فَسَتَذْكُرُونَ مَا أَقُولُ لَكُمْ وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ", "surah": "سورة غافر", "ayah": 44}, {"text": "فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ وَاسْتَغْفِرْ لِذَنْبِكَ وَسَبِّحْ بِحَمْدِ رَبِّكَ بِالْعَشِيِّ وَالْإِبْكَارِ", "surah": "سورة غافر", "ayah": 55}, {"text": "وَلَا تَسْتَوِي الْحَسَنَةُ وَلَا السَّيِّئَةُ ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيمٌ", "surah": "سورة فصلت", "ayah": 34}, {"text": "اللَّهُ لَطِيفٌ بِعِبَادِهِ يَرْزُقُ مَنْ يَشَاءُ وَهُوَ الْقَوِيُّ الْعَزِيزُ", "surah": "سورة الشورى", "ayah": 19}, {"text": "وَلَمَنْ صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنْ عَزْمِ الْأُمُورِ", "surah": "سورة الشورى", "ayah": 43}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَنْصُرُوا اللَّهَ يَنْصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ", "surah": "سورة محمد", "ayah": 7}, {"text": "إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة الحجرات", "ayah": 10}, {"text": "وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ", "surah": "سورة الذاريات", "ayah": 56}, {"text": "وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا وَسَبِّحْ بِحَمْدِ رَبِّكَ حِينَ تَقُومُ", "surah": "سورة الطور", "ayah": 48}, {"text": "وَأَنْ لَيْسَ لِلْإِنْسَانِ إِلَّا مَا سَعَىٰ", "surah": "سورة النجم", "ayah": 39}, {"text": "وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِنْ مُدَّكِرٍ", "surah": "سورة القمر", "ayah": 17}, {"text": "وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ", "surah": "سورة الرحمن", "ayah": 27}, {"text": "هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ", "surah": "سورة الرحمن", "ayah": 60}, {"text": "هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ هُوَ الرَّحْمَٰنُ الرَّحِيمُ", "surah": "سورة الحشر", "ayah": 22}, {"text": "مَا أَصَابَ مِنْ مُصِيبَةٍ إِلَّا بِإِذْنِ اللَّهِ وَمَنْ يُؤْمِنْ بِاللَّهِ يَهْدِ قَلْبَهُ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ", "surah": "سورة التغابن", "ayah": 11}, {"text": "الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا وَهُوَ الْعَزِيزُ الْغَفُورُ", "surah": "سورة الملك", "ayah": 2}, {"text": "فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا", "surah": "سورة نوح", "ayah": 10}, {"text": "وَاذْكُرِ اسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا", "surah": "سورة المزمل", "ayah": 8}, {"text": "إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنْكُمْ جَزَاءً وَلَا شُكُورًا", "surah": "سورة الإنسان", "ayah": 9}, {"text": "قَدْ أَفْلَحَ مَنْ تَزَكَّىٰ", "surah": "سورة الأعلى", "ayah": 14}, {"text": "وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ", "surah": "سورة الأعلى", "ayah": 17}, {"text": "يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ", "surah": "سورة الفجر", "ayah": 27}, {"text": "ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَرْضِيَّةً", "surah": "سورة الفجر", "ayah": 28}, {"text": "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ", "surah": "سورة الضحى", "ayah": 3}, {"text": "وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ", "surah": "سورة الضحى", "ayah": 11}, {"text": "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا", "surah": "سورة الشرح", "ayah": 5}, {"text": "اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ", "surah": "سورة العلق", "ayah": 1}, {"text": "فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ", "surah": "سورة الزلزلة", "ayah": 7}, {"text": "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ", "surah": "سورة الكوثر", "ayah": 1}, {"text": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا", "surah": "سورة النصر", "ayah": 3}, {"text": "قُلْ هُوَ اللَّهُ أَحَدٌ", "surah": "سورة الإخلاص", "ayah": 1}, {"text": "ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ", "surah": "سورة البقرة", "ayah": 2}, {"text": "يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 21}, {"text": "بَلَىٰ مَنْ أَسْلَمَ وَجْهَهُ لِلَّهِ وَهُوَ مُحْسِنٌ فَلَهُ أَجْرُهُ عِنْدَ رَبِّهِ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 112}, {"text": "وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ", "surah": "سورة البقرة", "ayah": 127}, {"text": "وَلِكُلٍّ وِجْهَةٌ هُوَ مُوَلِّيهَا فَاسْتَبِقُوا الْخَيْرَاتِ أَيْنَ مَا تَكُونُوا يَأْتِ بِكُمُ اللَّهُ جَمِيعًا إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة البقرة", "ayah": 148}, {"text": "وَلَنَبْلُوَنَّكُمْ بِشَيْءٍ مِنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِنَ الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ وَبَشِّرِ الصَّابِرِينَ", "surah": "سورة البقرة", "ayah": 155}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "surah": "سورة البقرة", "ayah": 183}, {"text": "حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ وَقُومُوا لِلَّهِ قَانِتِينَ", "surah": "سورة البقرة", "ayah": 238}, {"text": "مَنْ ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا فَيُضَاعِفَهُ لَهُ أَضْعَافًا كَثِيرَةً وَاللَّهُ يَقْبِضُ وَيَبْسُطُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة البقرة", "ayah": 245}, {"text": "قَوْلٌ مَعْرُوفٌ وَمَغْفِرَةٌ خَيْرٌ مِنْ صَدَقَةٍ يَتْبَعُهَا أَذًى وَاللَّهُ غَنِيٌّ حَلِيمٌ", "surah": "سورة البقرة", "ayah": 263}, {"text": "الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ بِاللَّيْلِ وَالنَّهَارِ سِرًّا وَعَلَانِيَةً فَلَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 274}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 277}, {"text": "وَإِنْ كَانَ ذُو عُسْرَةٍ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍ وَأَنْ تَصَدَّقُوا خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ", "surah": "سورة البقرة", "ayah": 280}, {"text": "رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَا رَيْبَ فِيهِ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 9}, {"text": "الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ", "surah": "سورة آل عمران", "ayah": 16}, {"text": "هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُ قَالَ رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", "surah": "سورة آل عمران", "ayah": 38}, {"text": "رَبَّنَا آمَنَّا بِمَا أَنْزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", "surah": "سورة آل عمران", "ayah": 53}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ حَقَّ تُقَاتِهِ وَلَا تَمُوتُنَّ إِلَّا وَأَنْتُمْ مُسْلِمُونَ", "surah": "سورة آل عمران", "ayah": 102}, {"text": "وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة آل عمران", "ayah": 104}, {"text": "وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ أُعِدَّتْ لِلْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 133}, {"text": "وَمَا كَانَ قَوْلَهُمْ إِلَّا أَنْ قَالُوا رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "surah": "سورة آل عمران", "ayah": 147}, {"text": "إِنْ يَنْصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ وَإِنْ يَخْذُلْكُمْ فَمَنْ ذَا الَّذِي يَنْصُرُكُمْ مِنْ بَعْدِهِ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "surah": "سورة آل عمران", "ayah": 160}, {"text": "رَبَّنَا وَآتِنَا مَا وَعَدْتَنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ", "surah": "سورة آل عمران", "ayah": 194}, {"text": "إِنْ تَجْتَنِبُوا كَبَائِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَنُدْخِلْكُمْ مُدْخَلًا كَرِيمًا", "surah": "سورة النساء", "ayah": 31}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ وَإِنْ تَكُ حَسَنَةً يُضَاعِفْهَا وَيُؤْتِ مِنْ لَدُنْهُ أَجْرًا عَظِيمًا", "surah": "سورة النساء", "ayah": 40}, {"text": "مَا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِنْ شَكَرْتُمْ وَآمَنْتُمْ وَكَانَ اللَّهُ شَاكِرًا عَلِيمًا", "surah": "سورة النساء", "ayah": 147}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ وَجَاهِدُوا فِي سَبِيلِهِ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة المائـدة", "ayah": 35}, {"text": "وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِنْ يَمْسَسْكَ بِخَيْرٍ فَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الأنعام", "ayah": 17}, {"text": "وَمَا الْحَيَاةُ الدُّنْيَا إِلَّا لَعِبٌ وَلَهْوٌ وَلَلدَّارُ الْآخِرَةُ خَيْرٌ لِلَّذِينَ يَتَّقُونَ أَفَلَا تَعْقِلُونَ", "surah": "سورة الأنعام", "ayah": 32}, {"text": "لَا تُدْرِكُهُ الْأَبْصَارُ وَهُوَ يُدْرِكُ الْأَبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الأنعام", "ayah": 103}, {"text": "مَنْ جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا وَمَنْ جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة الأنعام", "ayah": 160}, {"text": "يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِنْدَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ", "surah": "سورة الأعراف", "ayah": 31}, {"text": "ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ", "surah": "سورة الأعراف", "ayah": 55}, {"text": "وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة الأعراف", "ayah": 180}, {"text": "إِنَّ الَّذِينَ اتَّقَوْا إِذَا مَسَّهُمْ طَائِفٌ مِنَ الشَّيْطَانِ تَذَكَّرُوا فَإِذَا هُمْ مُبْصِرُونَ", "surah": "سورة الأعراف", "ayah": 201}, {"text": "وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنْصِتُوا لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة الأعراف", "ayah": 204}, {"text": "إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الأنفال", "ayah": 2}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ تَتَّقُوا اللَّهَ يَجْعَلْ لَكُمْ فُرْقَانًا وَيُكَفِّرْ عَنْكُمْ سَيِّئَاتِكُمْ وَيَغْفِرْ لَكُمْ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ", "surah": "سورة الأنفال", "ayah": 29}, {"text": "وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ وَسَتُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُونَ", "surah": "سورة التوبة", "ayah": 105}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ", "surah": "سورة التوبة", "ayah": 119}, {"text": "لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ", "surah": "سورة التوبة", "ayah": 128}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ يَهْدِيهِمْ رَبُّهُمْ بِإِيمَانِهِمْ تَجْرِي مِنْ تَحْتِهِمُ الْأَنْهَارُ فِي جَنَّاتِ النَّعِيمِ", "surah": "سورة يونس", "ayah": 9}, {"text": "إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنْفُسَهُمْ يَظْلِمُونَ", "surah": "سورة يونس", "ayah": 44}, {"text": "يَا أَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدًى وَرَحْمَةٌ لِلْمُؤْمِنِينَ", "surah": "سورة يونس", "ayah": 57}, {"text": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِمَّا يَجْمَعُونَ", "surah": "سورة يونس", "ayah": 58}, {"text": "وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ إِنَّ رَبِّي رَحِيمٌ وَدُودٌ", "surah": "سورة هود", "ayah": 90}, {"text": "وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ", "surah": "سورة يوسف", "ayah": 53}, {"text": "قَالَ لَا تَثْرِيبَ عَلَيْكُمُ الْيَوْمَ يَغْفِرُ اللَّهُ لَكُمْ وَهُوَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة يوسف", "ayah": 92}, {"text": "الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ طُوبَىٰ لَهُمْ وَحُسْنُ مَآبٍ", "surah": "سورة الرعد", "ayah": 29}, {"text": "يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ وَعِنْدَهُ أُمُّ الْكِتَابِ", "surah": "سورة الرعد", "ayah": 39}, {"text": "أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ", "surah": "سورة إبراهيم", "ayah": 24}, {"text": "وَآتَاكُمْ مِنْ كُلِّ مَا سَأَلْتُمُوهُ وَإِنْ تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا إِنَّ الْإِنْسَانَ لَظَلُومٌ كَفَّارٌ", "surah": "سورة إبراهيم", "ayah": 34}, {"text": "هَٰذَا بَلَاغٌ لِلنَّاسِ وَلِيُنْذَرُوا بِهِ وَلِيَعْلَمُوا أَنَّمَا هُوَ إِلَٰهٌ وَاحِدٌ وَلِيَذَّكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة إبراهيم", "ayah": 52}, {"text": "إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ", "surah": "سورة الحجر", "ayah": 9}, {"text": "وَاعْبُدْ رَبَّكَ حَتَّىٰ يَأْتِيَكَ الْيَقِينُ", "surah": "سورة الحجر", "ayah": 99}, {"text": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ", "surah": "سورة النحل", "ayah": 53}, {"text": "مَا عِنْدَكُمْ يَنْفَدُ وَمَا عِنْدَ اللَّهِ بَاقٍ وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا أَجْرَهُمْ بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "surah": "سورة النحل", "ayah": 96}, {"text": "فَكُلُوا مِمَّا رَزَقَكُمُ اللَّهُ حَلَالًا طَيِّبًا وَاشْكُرُوا نِعْمَتَ اللَّهِ إِنْ كُنْتُمْ إِيَّاهُ تَعْبُدُونَ", "surah": "سورة النحل", "ayah": 114}, {"text": "وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِي ضَيْقٍ مِمَّا يَمْكُرُونَ", "surah": "سورة النحل", "ayah": 127}, {"text": "إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا", "surah": "سورة الإسراء", "ayah": 9}, {"text": "وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُمْ مَشْكُورًا", "surah": "سورة الإسراء", "ayah": 19}, {"text": "وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 36}, {"text": "وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّكَ لَنْ تَخْرِقَ الْأَرْضَ وَلَنْ تَبْلُغَ الْجِبَالَ طُولًا", "surah": "سورة الإسراء", "ayah": 37}, {"text": "وَقُلْ لِعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنْزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنْسَانِ عَدُوًّا مُبِينًا", "surah": "سورة الإسراء", "ayah": 53}, {"text": "وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا", "surah": "سورة الإسراء", "ayah": 70}, {"text": "قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا", "surah": "سورة الإسراء", "ayah": 84}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا", "surah": "سورة الكهف", "ayah": 30}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا", "surah": "سورة الكهف", "ayah": 107}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَيَجْعَلُ لَهُمُ الرَّحْمَٰنُ وُدًّا", "surah": "سورة مريم", "ayah": 96}, {"text": "مَا أَنْزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ", "surah": "سورة طه", "ayah": 2}, {"text": "إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي", "surah": "سورة طه", "ayah": 14}, {"text": "وَإِنِّي لَغَفَّارٌ لِمَنْ تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ", "surah": "سورة طه", "ayah": 82}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَنَبْلُوكُمْ بِالشَّرِّ وَالْخَيْرِ فِتْنَةً وَإِلَيْنَا تُرْجَعُونَ", "surah": "سورة الأنبياء", "ayah": 35}, {"text": "وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ", "surah": "سورة الأنبياء", "ayah": 107}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ارْكَعُوا وَاسْجُدُوا وَاعْبُدُوا رَبَّكُمْ وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الحج", "ayah": 77}, {"text": "قَدْ أَفْلَحَ الْمُؤْمِنُونَ", "surah": "سورة المؤمنون", "ayah": 1}, {"text": "الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ", "surah": "سورة المؤمنون", "ayah": 2}, {"text": "وَالَّذِينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَ", "surah": "سورة المؤمنون", "ayah": 3}, {"text": "أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ", "surah": "سورة المؤمنون", "ayah": 115}, {"text": "وَمَنْ يُطِعِ اللَّهَ وَرَسُولَهُ وَيَخْشَ اللَّهَ وَيَتَّقْهِ فَأُولَٰئِكَ هُمُ الْفَائِزُونَ", "surah": "سورة النور", "ayah": 52}, {"text": "وَالَّذِينَ لَا يَشْهَدُونَ الزُّورَ وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا", "surah": "سورة الفرقان", "ayah": 72}, {"text": "أُولَٰئِكَ يُجْزَوْنَ الْغُرْفَةَ بِمَا صَبَرُوا وَيُلَقَّوْنَ فِيهَا تَحِيَّةً وَسَلَامًا", "surah": "سورة الفرقان", "ayah": 75}, {"text": "الَّذِي خَلَقَنِي فَهُوَ يَهْدِينِ", "surah": "سورة الشعراء", "ayah": 78}, {"text": "وَالَّذِي هُوَ يُطْعِمُنِي وَيَسْقِينِ", "surah": "سورة الشعراء", "ayah": 79}, {"text": "وَالَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ", "surah": "سورة الشعراء", "ayah": 82}, {"text": "يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ", "surah": "سورة الشعراء", "ayah": 88}, {"text": "وَتَوَكَّلْ عَلَى الْعَزِيزِ الرَّحِيمِ", "surah": "سورة الشعراء", "ayah": 217}, {"text": "إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَنْ يَشَاءُ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ", "surah": "سورة القصص", "ayah": 56}, {"text": "وَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَزِينَتُهَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ أَفَلَا تَعْقِلُونَ", "surah": "سورة القصص", "ayah": 60}, {"text": "تِلْكَ الدَّارُ الْآخِرَةُ نَجْعَلُهَا لِلَّذِينَ لَا يُرِيدُونَ عُلُوًّا فِي الْأَرْضِ وَلَا فَسَادًا وَالْعَاقِبَةُ لِلْمُتَّقِينَ", "surah": "سورة القصص", "ayah": 83}, {"text": "أَحَسِبَ النَّاسُ أَنْ يُتْرَكُوا أَنْ يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ", "surah": "سورة العنكبوت", "ayah": 2}, {"text": "وَمَنْ جَاهَدَ فَإِنَّمَا يُجَاهِدُ لِنَفْسِهِ إِنَّ اللَّهَ لَغَنِيٌّ عَنِ الْعَالَمِينَ", "surah": "سورة العنكبوت", "ayah": 6}, {"text": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ", "surah": "سورة العنكبوت", "ayah": 57}, {"text": "وَمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا إِلَّا لَهْوٌ وَلَعِبٌ وَإِنَّ الدَّارَ الْآخِرَةَ لَهِيَ الْحَيَوَانُ لَوْ كَانُوا يَعْلَمُونَ", "surah": "سورة العنكبوت", "ayah": 64}, {"text": "فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ وَلَا يَسْتَخِفَّنَّكَ الَّذِينَ لَا يُوقِنُونَ", "surah": "سورة الروم", "ayah": 60}, {"text": "وَإِذْ قَالَ لُقْمَانُ لِابْنِهِ وَهُوَ يَعِظُهُ يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ", "surah": "سورة لقمان", "ayah": 13}, {"text": "وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّ اللَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٍ فَخُورٍ", "surah": "سورة لقمان", "ayah": 18}, {"text": "وَاقْصِدْ فِي مَشْيِكَ وَاغْضُضْ مِنْ صَوْتِكَ إِنَّ أَنْكَرَ الْأَصْوَاتِ لَصَوْتُ الْحَمِيرِ", "surah": "سورة لقمان", "ayah": 19}, {"text": "وَمَنْ يُسْلِمْ وَجْهَهُ إِلَى اللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ وَإِلَى اللَّهِ عَاقِبَةُ الْأُمُورِ", "surah": "سورة لقمان", "ayah": 22}, {"text": "لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ لِمَنْ كَانَ يَرْجُو اللَّهَ وَالْيَوْمَ الْآخِرَ وَذَكَرَ اللَّهَ كَثِيرًا", "surah": "سورة الأحزاب", "ayah": 21}, {"text": "يَا أَيُّهَا النَّاسُ إِنَّ وَعْدَ اللَّهِ حَقٌّ فَلَا تَغُرَّنَّكُمُ الْحَيَاةُ الدُّنْيَا وَلَا يَغُرَّنَّكُمْ بِاللَّهِ الْغَرُورُ", "surah": "سورة فاطر", "ayah": 5}, {"text": "يَا أَيُّهَا النَّاسُ أَنْتُمُ الْفُقَرَاءُ إِلَى اللَّهِ وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ", "surah": "سورة فاطر", "ayah": 15}, {"text": "سَلَامٌ قَوْلًا مِنْ رَبٍّ رَحِيمٍ", "surah": "سورة يس", "ayah": 58}, {"text": "إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُولَ لَهُ كُنْ فَيَكُونُ", "surah": "سورة يس", "ayah": 82}, {"text": "سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ", "surah": "سورة الصافات", "ayah": 180}, {"text": "وَسَلَامٌ عَلَى الْمُرْسَلِينَ", "surah": "سورة الصافات", "ayah": 181}, {"text": "وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة الصافات", "ayah": 182}, {"text": "الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ", "surah": "سورة الزمر", "ayah": 18}, {"text": "وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ", "surah": "سورة الزمر", "ayah": 54}, {"text": "يَا قَوْمِ إِنَّمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ الْقَرَارِ", "surah": "سورة غافر", "ayah": 39}, {"text": "هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة غافر", "ayah": 65}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ الْمَلَائِكَةُ أَلَّا تَخَافُوا وَلَا تَحْزَنُوا وَأَبْشِرُوا بِالْجَنَّةِ الَّتِي كُنْتُمْ تُوعَدُونَ", "surah": "سورة فصلت", "ayah": 30}, {"text": "وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ", "surah": "سورة فصلت", "ayah": 33}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا وَمَا رَبُّكَ بِظَلَّامٍ لِلْعَبِيدِ", "surah": "سورة فصلت", "ayah": 46}, {"text": "فَاطِرُ السَّمَاوَاتِ وَالْأَرْضِ جَعَلَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا وَمِنَ الْأَنْعَامِ أَزْوَاجًا يَذْرَؤُكُمْ فِيهِ لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ", "surah": "سورة الشورى", "ayah": 11}, {"text": "وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة الشورى", "ayah": 25}, {"text": "وَمَا أَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَنْ كَثِيرٍ", "surah": "سورة الشورى", "ayah": 30}, {"text": "فَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ لِلَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الشورى", "ayah": 36}, {"text": "وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللَّهِ إِنَّهُ لَا يُحِبُّ الظَّالِمِينَ", "surah": "سورة الشورى", "ayah": 40}, {"text": "الْأَخِلَّاءُ يَوْمَئِذٍ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ إِلَّا الْمُتَّقِينَ", "surah": "سورة الزخرف", "ayah": 67}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ", "surah": "سورة الجاثية", "ayah": 15}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة الأحقاف", "ayah": 13}, {"text": "فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنْبِكَ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَاللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْوَاكُمْ", "surah": "سورة محمد", "ayah": 19}, {"text": "مَا يَلْفِظُ مِنْ قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ", "surah": "سورة ق", "ayah": 18}, {"text": "وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ غَيْرَ بَعِيدٍ", "surah": "سورة ق", "ayah": 31}, {"text": "كَانُوا قَلِيلًا مِنَ اللَّيْلِ مَا يَهْجَعُونَ", "surah": "سورة الذاريات", "ayah": 17}, {"text": "وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ", "surah": "سورة الذاريات", "ayah": 18}, {"text": "فَفِرُّوا إِلَى اللَّهِ إِنِّي لَكُمْ مِنْهُ نَذِيرٌ مُبِينٌ", "surah": "سورة الذاريات", "ayah": 50}, {"text": "إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ", "surah": "سورة الذاريات", "ayah": 58}, {"text": "كُلُّ مَنْ عَلَيْهَا فَانٍ", "surah": "سورة الرحمن", "ayah": 26}, {"text": "هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ", "surah": "سورة الحديد", "ayah": 3}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَفْسٌ مَا قَدَّمَتْ لِغَدٍ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ", "surah": "سورة الحشر", "ayah": 18}, {"text": "وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنْسَاهُمْ أَنْفُسَهُمْ أُولَٰئِكَ هُمُ الْفَاسِقُونَ", "surah": "سورة الحشر", "ayah": 19}, {"text": "هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ", "surah": "سورة الحشر", "ayah": 24}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ", "surah": "سورة الصف", "ayah": 2}, {"text": "كَبُرَ مَقْتًا عِنْدَ اللَّهِ أَنْ تَقُولُوا مَا لَا تَفْعَلُونَ", "surah": "سورة الصف", "ayah": 3}, {"text": "فَإِذَا قُضِيَتِ الصَّلَاةُ فَانْتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِنْ فَضْلِ اللَّهِ وَاذْكُرُوا اللَّهَ كَثِيرًا لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الجمعة", "ayah": 10}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَنْ ذِكْرِ اللَّهِ وَمَنْ يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ", "surah": "سورة المنافقون", "ayah": 9}, {"text": "إِنَّمَا أَمْوَالُكُمْ وَأَوْلَادُكُمْ فِتْنَةٌ وَاللَّهُ عِنْدَهُ أَجْرٌ عَظِيمٌ", "surah": "سورة التغابن", "ayah": 15}, {"text": "فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ وَاسْمَعُوا وَأَطِيعُوا وَأَنْفِقُوا خَيْرًا لِأَنْفُسِكُمْ وَمَنْ يُوقَ شُحَّ نَفْسِهِ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة التغابن", "ayah": 16}, {"text": "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الملك", "ayah": 1}, {"text": "وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ", "surah": "سورة الملك", "ayah": 13}, {"text": "أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الملك", "ayah": 14}, {"text": "هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ وَإِلَيْهِ النُّشُورُ", "surah": "سورة الملك", "ayah": 15}, {"text": "وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ", "surah": "سورة القلم", "ayah": 4}, {"text": "رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا", "surah": "سورة المزمل", "ayah": 9}, {"text": "وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا", "surah": "سورة الإنسان", "ayah": 8}, {"text": "وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا", "surah": "سورة النبإ", "ayah": 9}, {"text": "سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى", "surah": "سورة الأعلى", "ayah": 1}, {"text": "بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا", "surah": "سورة الأعلى", "ayah": 16}, {"text": "أَفَلَا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ", "surah": "سورة الغاشية", "ayah": 17}, {"text": "قَدْ أَفْلَحَ مَنْ زَكَّاهَا", "surah": "سورة الشمس", "ayah": 9}, {"text": "وَقَدْ خَابَ مَنْ دَسَّاهَا", "surah": "سورة الشمس", "ayah": 10}, {"text": "وَلَلْآخِرَةُ خَيْرٌ لَكَ مِنَ الْأُولَىٰ", "surah": "سورة الضحى", "ayah": 4}, {"text": "أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ", "surah": "سورة الشرح", "ayah": 1}, {"text": "فَإِذَا فَرَغْتَ فَانْصَبْ", "surah": "سورة الشرح", "ayah": 7}, {"text": "لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ", "surah": "سورة التين", "ayah": 4}, {"text": "اقْرَأْ وَرَبُّكَ الْأَكْرَمُ", "surah": "سورة العلق", "ayah": 3}, {"text": "لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ", "surah": "سورة القدر", "ayah": 3}, {"text": "وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ", "surah": "سورة الزلزلة", "ayah": 8}, {"text": "أَلْهَاكُمُ التَّكَاثُرُ", "surah": "سورة التكاثر", "ayah": 1}, {"text": "ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ", "surah": "سورة التكاثر", "ayah": 8}, {"text": "إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ", "surah": "سورة العصر", "ayah": 2}, {"text": "فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ", "surah": "سورة قريش", "ayah": 3}, {"text": "اللَّهُ الصَّمَدُ", "surah": "سورة الإخلاص", "ayah": 2}, {"text": "لَمْ يَلِدْ وَلَمْ يُولَدْ", "surah": "سورة الإخلاص", "ayah": 3}, {"text": "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", "surah": "سورة الإخلاص", "ayah": 4}, {"text": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ", "surah": "سورة الفلق", "ayah": 1}, {"text": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ", "surah": "سورة الناس", "ayah": 1}, {"text": "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِنْ ذُرِّيَّتِنَا أُمَّةً مُسْلِمَةً لَكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", "surah": "سورة البقرة", "ayah": 128}, {"text": "وَأَنْفِقُوا فِي سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ وَأَحْسِنُوا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ", "surah": "سورة البقرة", "ayah": 195}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ادْخُلُوا فِي السِّلْمِ كَافَّةً وَلَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ", "surah": "سورة البقرة", "ayah": 208}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ وَاللَّهُ غَفُورٌ رَحِيمٌ", "surah": "سورة البقرة", "ayah": 218}, {"text": "الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُمْ بِالْفَحْشَاءِ وَاللَّهُ يَعِدُكُمْ مَغْفِرَةً مِنْهُ وَفَضْلًا وَاللَّهُ وَاسِعٌ عَلِيمٌ", "surah": "سورة البقرة", "ayah": 268}, {"text": "إِنْ تُبْدُوا الصَّدَقَاتِ فَنِعِمَّا هِيَ وَإِنْ تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَكُمْ وَيُكَفِّرُ عَنْكُمْ مِنْ سَيِّئَاتِكُمْ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ", "surah": "سورة البقرة", "ayah": 271}, {"text": "يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ وَاللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ", "surah": "سورة البقرة", "ayah": 276}, {"text": "وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة البقرة", "ayah": 281}, {"text": "شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ قَائِمًا بِالْقِسْطِ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ", "surah": "سورة آل عمران", "ayah": 18}, {"text": "بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِ وَاتَّقَىٰ فَإِنَّ اللَّهَ يُحِبُّ الْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 76}, {"text": "وَمَنْ يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ", "surah": "سورة آل عمران", "ayah": 85}, {"text": "وَأَطِيعُوا اللَّهَ وَالرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة آل عمران", "ayah": 132}, {"text": "أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَعْلَمِ اللَّهُ الَّذِينَ جَاهَدُوا مِنْكُمْ وَيَعْلَمَ الصَّابِرِينَ", "surah": "سورة آل عمران", "ayah": 142}, {"text": "وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَا xt": "قَالَ رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأعراف", "ayah": 151}, {"text": "وَاذْكُرْ رَبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ بِالْغُدُوِّ وَالْآصَالِ وَلَا تَكُنْ مِنَ الْغَافِلِينَ", "surah": "سورة الأعراف", "ayah": 205}, {"text": "وَاللَّهُ يَدْعُو إِلَىٰ دَارِ السَّلَامِ وَيَهْدِي مَنْ يَشَاءُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "surah": "سورة يونس", "ayah": 25}, {"text": "لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌ وَلَا ذِلَّةٌ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ هُمْ فِيهَا خَالِدُونَ", "surah": "سورة يونس", "ayah": 26}, {"text": "وَيَا قَوْمِ اسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا وَيَزِدْكُمْ قُوَّةً إِلَىٰ قُوَّتِكُمْ وَلَا تَتَوَلَّوْا مُجْرِمِينَ", "surah": "سورة هود", "ayah": 52}, {"text": "إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُمْ مَا مِنْ دَابَّةٍ إِلَّا هُوَ آخِذٌ بِنَاصِيَتِهَا إِنَّ رَبِّي عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "surah": "سورة هود", "ayah": 56}, {"text": "وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ وَإِلَيْهِ يُرْجَعُ الْأَمْرُ كُلُّهُ فَاعْبُدْهُ وَتَوَكَّلْ عَلَيْهِ وَمَا رَبُّكَ بِغَافِلٍ عَمَّا تَعْمَلُونَ", "surah": "سورة هود", "ayah": 123}, {"text": "قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي وَسُبْحَانَ اللَّهِ وَمَا أَنَا مِنَ الْمُشْرِكِينَ", "surah": "سورة يوسف", "ayah": 108}, {"text": "اللَّهُ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ وَيَقْدِرُ وَفَرِحُوا بِالْحَيَاةِ الدُّنْيَا وَمَا الْحَيَاةُ الدُّنْيَا فِي الْآخِرَةِ إِلَّا مَتَاعٌ", "surah": "سورة الرعد", "ayah": 26}, {"text": "يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ وَيُضِلُّ اللَّهُ الظَّالِمِينَ وَيَفْعَلُ اللَّهُ مَا يَشَاءُ", "surah": "سورة إبراهيم", "ayah": 27}, {"text": "وَاللَّهُ أَخْرَجَكُمْ مِنْ بُطُونِ أُمَّهَاتِكُمْ لَا تَعْلَمُونَ شَيْئًا وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ لَعَلَّكُمْ تَشْكُرُونَ", "surah": "سورة النحل", "ayah": 78}, {"text": "وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدْتُمْ وَلَا تَنْقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا إِنَّ اللَّهَ يَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة النحل", "ayah": 91}, {"text": "فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "surah": "سورة النحل", "ayah": 98}, {"text": "رَبُّكُمْ أَعْلَمُ بِمَا فِي نُفُوسِكُمْ إِنْ تَكُونُوا صَالِحِينَ فَإِنَّهُ كَانَ لِلْأَوَّابِينَ غَفُورًا", "surah": "سورة الإسراء", "ayah": 25}, {"text": "وَآتِ ذَا الْقُرْبَىٰ حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا", "surah": "سورة الإسراء", "ayah": 26}, {"text": "وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَحْسُورًا", "surah": "سورة الإسراء", "ayah": 29}, {"text": "وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُ وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 34}, {"text": "وَأَوْفُوا الْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا", "surah": "سورة الإسراء", "ayah": 35}, {"text": "وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَكَ عَسَىٰ أَنْ يَبْعَثَكَ رَبُّكَ مَقَامًا مَحْمُودًا", "surah": "سورة الإسراء", "ayah": 79}, {"text": "قُلْ لَوْ كَانَ الْبَحْرُ مِدَادًا لِكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَنْ تَنْفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا", "surah": "سورة الكهف", "ayah": 109}, {"text": "رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا فَاعْبُدْهُ وَاصْطَبِرْ لِعِبَادَتِهِ هَلْ تَعْلَمُ لَهُ سَمِيًّا", "surah": "سورة مريم", "ayah": 65}, {"text": "وَيَزِيدُ اللَّهُ الَّذِينَ اهْتَدَوْا هُدًى وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِنْدَ رَبِّكَ ثَوَابًا وَخَيْرٌ مَرَدًّا", "surah": "سورة مريم", "ayah": 76}, {"text": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ", "surah": "سورة طه", "ayah": 8}, {"text": "وَمَنْ أَعْرَضَ عَنْ ذِكْرِي فَإِنَّ لَهُ مَعِيشَةً ضَنْكًا وَنَحْشُرُهُ يَوْمَ الْقِيَامَةِ أَعْمَىٰ", "surah": "سورة طه", "ayah": 124}, {"text": "فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا وَمِنْ آنَاءِ اللَّيْلِ فَسَبِّحْ وَأَطْرَافَ النَّهَارِ لَعَلَّكَ تَرْضَىٰ", "surah": "سورة طه", "ayah": 130}, {"text": "وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِنْهُمْ زَهْرَةَ الْحَيَاةِ الدُّنْيَا لِنَفْتِنَهُمْ فِيهِ وَرِزْقُ رَبِّكَ خَيْرٌ وَأَبْقَىٰ", "surah": "سورة طه", "ayah": 131}, {"text": "وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا وَإِنْ كَانَ مِثْقَالَ حَبَّةٍ مِنْ خَرْدَلٍ أَتَيْنَا بِهَا وَكَفَىٰ بِنَا حَاسِبِينَ", "surah": "سورة الأنبياء", "ayah": 47}, {"text": "ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ السَّيِّئَةَ نَحْنُ أَعْلَمُ بِمَا يَصِفُونَ", "surah": "سورة المؤمنون", "ayah": 96}, {"text": "وَقُلْ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ", "surah": "سورة المؤمنون", "ayah": 97}, {"text": "وَمَنْ تَابَ وَعَمِلَ صَالِحًا فَإِنَّهُ يَتُوبُ إِلَى اللَّهِ مَتَابًا", "surah": "سورة الفرقان", "ayah": 71}, {"text": "وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ", "surah": "سورة الشعراء", "ayah": 84}, {"text": "وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ", "surah": "سورة الشعراء", "ayah": 85}, {"text": "وَلَا تُخْزِنِي يَوْمَ يُبْعَثُونَ", "surah": "سورة الشعراء", "ayah": 87}, {"text": "قُلِ الْحَمْدُ لِلَّهِ وَسَلَامٌ عَلَىٰ عِبَادِهِ الَّذِينَ اصْطَفَىٰ آللَّهُ خَيْرٌ أَمَّا يُشْرِكُونَ", "surah": "سورة النمل", "ayah": 59}, {"text": "وَهُوَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ لَهُ الْحَمْدُ فِي الْأُولَىٰ وَالْآخِرَةِ وَلَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة القصص", "ayah": 70}, {"text": "وَلَا تَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ لَا إِلَٰهَ إِلَّا هُوَ كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ لَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة القصص", "ayah": 88}, {"text": "وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَنُبَوِّئَنَّهُمْ مِنَ الْجَنَّةِ غُرَفًا تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا نِعْمَ أَجْرُ الْعَامِلِينَ", "surah": "سورة العنكبوت", "ayah": 58}, {"text": "وَكَأَيِّنْ مِنْ دَابَّةٍ لَا تَحْمِلُ رِزْقَهَا اللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ وَهُوَ السَّمِيعُ الْعَلِيمُ", "surah": "سورة العنكبوت", "ayah": 60}, {"text": "فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ", "surah": "سورة الروم", "ayah": 17}, {"text": "وَمِنْ آيَاتِهِ خَلْقُ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافُ أَلْسِنَتِكُمْ وَأَلْوَانِكُمْ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِلْعَالِمِينَ", "surah": "سورة الروم", "ayah": 22}, {"text": "وَوَصَّيْنَا الْإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَىٰ وَهْنٍ وَفِصَالُهُ فِي عَامَيْنِ أَنِ اشْكُرْ لِي وَلِوَالِدَيْكَ إِلَيَّ الْمَصِيرُ", "surah": "سورة لقمان", "ayah": 14}, {"text": "هُوَ الَّذِي يُصَلِّي عَلَيْكُمْ وَمَلَائِكَتُهُ لِيُخْرِجَكُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ وَكَانَ بِالْمُؤْمِنِينَ رَحِيمًا", "surah": "سورة الأحزاب", "ayah": 43}, {"text": "قُلْ إِنَّ رَبِّي يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ لَهُ وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ يُخْلِفُهُ وَهُوَ خَيْرُ الرَّازِقِينَ", "surah": "سورة سبإ", "ayah": 39}, {"text": "مَا يَفْتَحِ اللَّهُ لِلنَّاسِ مِنْ رَحْمَةٍ فَلَا مُمْسِكَ لَهَا وَمَا يُمْسِكْ فَلَا مُرْسِلَ لَهُ مِنْ بَعْدِهِ وَهُوَ الْعَزِيزُ الْحَكِيمُ", "surah": "سورة فاطر", "ayah": 2}, {"text": "إِنَّ الَّذِينَ يَتْلُونَ كِتَابَ اللَّهِ وَأَقَامُوا الصَّلَاةَ وَأَنْفَقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً يَرْجُونَ تِجَارَةً لَنْ تَبُورَ", "surah": "سورة فاطر", "ayah": 29}, {"text": "فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة يس", "ayah": 83}, {"text": "كِتَابٌ أَنْزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِيَدَّبَّرُوا آيَاتِهِ وَلِيَتَذَكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة ص", "ayah": 29}, {"text": "يَعْلَمُ خَائِنَةَ الْأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ", "surah": "سورة غافر", const AR = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const parts = (d, o) => Object.fromEntries(new Intl.DateTimeFormat('en-US', Object.assign({timeZone: CONFIG.tz}, o))
  .formatToParts(d).map(p => [p.type, p.value]));
const hm = d => { const p = parts(d, {hour:'numeric', minute:'2-digit', hourCycle:'h23'}); return +p.hour * 60 + +p.minute; };
function t12(d){
  const p = parts(d, {hour:'numeric', minute:'2-digit', hourCycle:'h23'});
  const h = +p.hour;
  return {t: AR((h % 12 || 12) + ':' + p.minute), ap: h < 12 ? 'ص' : 'م'};
}
const plural = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? AR(n) + ' ' + few : AR(n) + ' ' + many;

// ---------------------------------------------------------------- icons
const I = {
  pin: '', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  rise: '<path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 4v5M9 7l3-3 3 3"/>',
  set:  '<path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 4v5M9 6l3 3 3-3"/>',
  cloudsun: '<path d="M8 4v1.5M3.8 5.8l1 1M2 10h1.5"/><path d="M5.6 12.2A4 4 0 1 1 12 8"/><path d="M8 20h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 8 20z"/>',
  cloud: '<path d="M7 19h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.7A3.7 3.7 0 0 0 7 19z"/>',
  rain: '<path d="M7 15h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.7A3.7 3.7 0 0 0 7 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>',
  storm: '<path d="M7 15h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.7A3.7 3.7 0 0 0 7 15z"/><path d="M13 15l-2 3.5h3L12 22"/>',
  fog: '<path d="M4 9h16M3 13h18M5 17h14"/>',
  cloudmoon: '<path d="M14.5 3.5a5 5 0 0 0 6 6 5 5 0 0 1-6-6z"/><path d="M7 20h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 20z"/>',
};
const svg = (k, sw = 1.7) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
// the crescent beside a clear night, drawn filled like the photo's moon
const WX_MOON = '<svg viewBox="0 0 48 48"><path fill="#fff6d6" d="M34 30A15 15 0 1 1 18 8a12 12 0 0 0 16 22z"/><path fill="#fff6d6" d="M38 9l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1zM31 4l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/></svg>';
const WX_SUN = '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9" fill="#ffe27a"/><g stroke="#ffe27a" stroke-width="3" stroke-linecap="round"><path d="M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M10.6 37.4l3.5-3.5M33.9 14.1l3.5-3.5"/></g></svg>';

// ---------------------------------------------------------------- clock and dates
function tickClock(){
  const t = t12(now());
  document.getElementById('hm').innerHTML = t.t.split('').map(c => c === ':' ? '<span class="c"><i></i><i></i></span>' : `<span class="d">${c}</span>`).join('');
  document.getElementById('ampm').textContent = t.ap;
}
function tickDates(){
  const d = now();
  document.getElementById('day').textContent = new Intl.DateTimeFormat('ar-SA', {timeZone: CONFIG.tz, weekday: 'long'}).format(d);
  let h = '';
  try{
    h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab', {timeZone: CONFIG.tz, day: 'numeric', month: 'long', year: 'numeric'})
      .format(d).replace(/\s*هـ\s*$/, '') + ' هـ';
  }catch(e){}
  document.getElementById('hijri').textContent = h;
  document.getElementById('greg').textContent = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',
    {timeZone: CONFIG.tz, day: 'numeric', month: 'long', year: 'numeric'}).format(d) + ' م';
}

// ---------------------------------------------------------------- prayers (Umm al-Qura, computed here: no network)
const NAMES = [['fajr','الفجر','rise'],['dhuhr','الظهر','sun'],['asr','العصر','cloudsun'],['maghrib','المغرب','set'],['isha','العشاء','moon']];
let TODAY = null;
function timesFor(d){
  const p = parts(d, {year:'numeric', month:'numeric', day:'numeric'});
  // noon UTC of that Riyadh date, so the library picks the right day whatever the device's own zone
  const date = new Date(Date.UTC(+p.year, +p.month - 1, +p.day, 12));
  const params = adhan.CalculationMethod.UmmAlQura();
  return new adhan.PrayerTimes(new adhan.Coordinates(CONFIG.lat, CONFIG.lon), date, params);
}
function isFriday(d){ return parts(d, {weekday:'short'}).weekday === 'Fri'; }
function tickPrayers(){
  const d = now();
  let pt;
  try{ pt = timesFor(d); }catch(e){ return; }
  TODAY = pt;
  const n = d.getTime();
  let next = NAMES.findIndex(([k]) => pt[k].getTime() > n);
  const list = document.getElementById('prayers');
  list.innerHTML = NAMES.map(([k, name, icon], i) => {
    const t = t12(pt[k]);
    const label = k === 'dhuhr' && isFriday(d) ? 'الجمعة' : name;
    const cls = i === next ? 'next' : (next === -1 || i < next) ? 'past' : '';
    return `<li class="${cls}">${svg(icon)}<span class="n">${label}</span><span class="t num">${t.t} ${t.ap}</span></li>`;
  }).join('');
  // after Isha: tomorrow's Fajr is next
  if(next === -1) list.firstElementChild.classList.add('next');
}

// ---------------------------------------------------------------- weather (Open-Meteo, no key)
const WX = {
  0:['صافي','clear'],1:['صافي غالباً','clear'],2:['غائم جزئياً','partly'],3:['غائم','cloud'],45:['ضباب','fog'],48:['ضباب','fog'],
  51:['رذاذ','rain'],53:['رذاذ','rain'],55:['رذاذ كثيف','rain'],56:['رذاذ متجمد','rain'],57:['رذاذ متجمد','rain'],
  61:['مطر خفيف','rain'],63:['مطر','rain'],65:['مطر غزير','rain'],66:['مطر متجمد','rain'],67:['مطر متجمد','rain'],
  71:['ثلج خفيف','cloud'],73:['ثلج','cloud'],75:['ثلج كثيف','cloud'],77:['حبيبات ثلج','cloud'],
  80:['زخات خفيفة','rain'],81:['زخات مطر','rain'],82:['زخات غزيرة','rain'],85:['زخات ثلج','cloud'],86:['زخات ثلج','cloud'],
  95:['عواصف رعدية','storm'],96:['عواصف مصحوبة ببرد','storm'],99:['عواصف قوية','storm'],
};
function wxIcon(kind, isDay){
  if(kind === 'clear') return isDay ? WX_SUN : WX_MOON;
  const k = kind === 'partly' ? (isDay ? 'cloudsun' : 'cloudmoon') : kind;
  return `<span style="display:block;width:100%;height:100%;color:#fff">${svg(k, 1.5)}</span>`;
}
function showWeather(j){
  const wx = document.getElementById('wx');
  if(!j || !j.current){ wx.classList.add('wx-none'); return; }
  const c = j.current;
  const [desc, kind] = WX[c.weather_code] || ['', 'cloud'];
  document.getElementById('wx-temp').textContent = AR(Math.round(c.temperature_2m)) + '°';
  document.getElementById('wx-desc').textContent = desc;
  document.getElementById('wx-icon').innerHTML = wxIcon(kind, c.is_day === 1);
  document.getElementById('wx-feel').textContent = c.apparent_temperature != null ? AR(Math.round(c.apparent_temperature)) + '°' : '–';
  document.getElementById('wx-hum').textContent = c.relative_humidity_2m != null ? AR(Math.round(c.relative_humidity_2m)) + '٪' : '–';
  document.getElementById('wx-wind').textContent = c.wind_speed_10m != null ? AR(Math.round(c.wind_speed_10m)) : '–';
  wx.classList.remove('wx-none');
}
async function loadWeather(){
  const key = 'wx:' + CONFIG.lat + ',' + CONFIG.lon;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`
    + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day`
    + `&timezone=${encodeURIComponent(CONFIG.tz)}`;
  try{
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(url, {signal: ctl.signal}); clearTimeout(to);
    if(!r.ok) throw 0;
    const j = await r.json();
    showWeather(j);
    try{ localStorage.setItem(key, JSON.stringify({at: Date.now(), j})); }catch(e){}
  }catch(e){
    // the last reading, if it is under 3 hours old; never an invented one
    let old = null;
    try{ old = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
    showWeather(old && Date.now() - old.at < 3 * 3600000 ? old.j : null);
  }
}

// ---------------------------------------------------------------- a verse and a hadith, a new pair every minute
const PAGE_MS = 60000;
let vOrder = [], hOrder = [], page = 0;
function shuffled(n, seed){
  const o = Array.from({length: n}, (_, i) => i);
  for(let i = n - 1; i > 0; i--){
    seed = (seed * 48271) % 2147483647;
    const j = seed % (i + 1);
    [o[i], o[j]] = [o[j], o[i]];
  }
  return o;
}
function shuffleForToday(){
  const p = parts(now(), {year:'numeric', month:'numeric', day:'numeric'});
  const seed = (+p.year * 400 + +p.month * 32 + +p.day) % 2147483646 + 1;
  vOrder = shuffled(VERSES.length, seed);
  hOrder = shuffled(HADITH.length, seed + 7);
  page = 0;
}
function showQuotes(){
  if(VERSES.length){
    const v = VERSES[vOrder[page % vOrder.length]];
    document.getElementById('vrow').innerHTML = `<article class="h in"><div class="who">قال الله تعالى</div>`
      + `<div class="tx"><span class="orn">﴿</span>${v.text}<span class="orn">﴾</span></div><div class="src">${v.surah} · ${AR(v.ayah)}</div></article>`;
  }
  if(HADITH.length){
    const h = HADITH[hOrder[page % hOrder.length]];
    document.getElementById('hrow').innerHTML = `<article class="h in"><div class="who">قال رسول الله ﷺ</div>`
      + `<div class="tx">«${h.t}»</div><div class="src">${h.s}</div></article>`;
  }
  // only one of the two: it takes the whole row
  document.getElementById('quotes').style.gridTemplateColumns = VERSES.length && HADITH.length ? '' : '1fr';
  page++;
}

// ---------------------------------------------------------------- start
// the launcher passes new settings by changing the fragment: start over with them
window.addEventListener('hashchange', () => location.reload());
document.getElementById('wx-name').textContent = CONFIG.city;
let lastDay = '';
function everyMinute(){
  tickClock(); tickDates(); tickPrayers();
  const day = parts(now(), {year:'numeric', month:'numeric', day:'numeric'});
  const k = day.year + '-' + day.month + '-' + day.day;
  if(k !== lastDay){ lastDay = k; shuffleForToday(); showQuotes(); }
}
everyMinute();
loadWeather();
// on the minute, so the clock never lags behind the TV's own
setTimeout(() => { everyMinute(); setInterval(everyMinute, 60000); }, 60000 - Date.now() % 60000 + 50);
setInterval(showQuotes, PAGE_MS);
setInterval(loadWeather, 30 * 60000);
</script>
